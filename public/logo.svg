<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shield Blue Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3e68"/>
      <stop offset="40%" stop-color="#102540"/>
      <stop offset="100%" stop-color="#091424"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae084"/>
      <stop offset="35%" stop-color="#dfb141"/>
      <stop offset="70%" stop-color="#fdf3b0"/>
      <stop offset="100%" stop-color="#b8861d"/>
    </linearGradient>

    <!-- Flame Gold Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>

    <!-- Torch Stem Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" fill="none"/>

  <!-- Background Decorative Lines / Glow -->
  <circle cx="430" cy="140" r="160" fill="#38bdf8" fill-opacity="0.08" filter="blur(40px)"/>
  <circle cx="80" cy="400" r="140" fill="#f59e0b" fill-opacity="0.06" filter="blur(40px)"/>

  <!-- Main Shield Outer Silhouette -->
  <g filter="url(#shadow)">
    <!-- Outer Shield Crest Border -->
    <path d="M 160 180 L 352 180 L 400 230 L 400 320 C 400 395 315 445 256 465 C 197 445 112 395 112 320 L 112 230 Z" 
          fill="url(#goldGrad)"/>

    <!-- Shield Dark Royal Blue Fill -->
    <path d="M 166 186 L 346 186 L 392 234 L 392 318 C 392 388 312 436 256 455 C 200 436 120 388 120 318 L 120 234 Z" 
          fill="url(#shieldGrad)"/>

    <!-- Inner Golden Thin Crest Line -->
    <path d="M 174 200 L 338 200 L 380 242 L 380 315 C 380 375 308 420 256 438 C 204 420 132 375 132 315 L 132 242 Z" 
          stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.6"/>
  </g>

  <!-- Top Crown: Stylized "7" with Flame & Arrow -->
  <g filter="url(#shadow)">
    <!-- Torch Base & Pedestal under Top 7 -->
    <polygon points="236,155 276,155 284,168 228,168" fill="url(#goldGrad)"/>
    <rect x="246" y="148" width="20" height="7" rx="2" fill="url(#goldGrad)"/>

    <!-- Top Flame Elements -->
    <path d="M 256 95 C 248 110 242 122 245 136 C 248 148 264 148 267 136 C 270 120 262 105 256 95 Z" fill="url(#flameGrad)"/>
    <path d="M 264 108 C 272 118 276 128 274 138 C 272 144 266 146 264 140 C 262 130 260 120 264 108 Z" fill="url(#goldGrad)"/>
    <path d="M 248 114 C 244 122 242 130 244 137 C 246 141 250 142 250 138 C 250 130 247 122 248 114 Z" fill="#ffffff" opacity="0.8"/>

    <!-- Stylized 3D Number 7 -->
    <!-- 7 Horizontal Bar with Silver/White face and Gold edge -->
    <polygon points="220,165 292,165 278,178 228,178" fill="url(#silverGrad)"/>
    <polygon points="228,178 278,178 254,232 240,232" fill="url(#silverGrad)"/>
    
    <!-- Gold 3D shadow facet of 7 -->
    <polygon points="292,165 316,165 268,235 254,232 278,178" fill="url(#goldGrad)"/>
    
    <!-- Arrow Head pointing up-right integrated in 7 -->
    <polygon points="295,135 320,158 308,160 300,146 288,155" fill="url(#goldGrad)"/>
  </g>

  <!-- Center Text Banner: KİLİS 7 ARALIK ÜNİVERSİTESİ -->
  <g>
    <!-- Dark text backing for contrast -->
    <rect x="130" y="212" width="252" height="48" rx="6" fill="#0b1726" fill-opacity="0.9" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.4"/>
    
    <!-- Main Header Typography -->
    <text x="256" y="234" font-family="'Outfit', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="20" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      KİLİS 7 ARALIK
    </text>
    
    <!-- Subtitle Typography -->
    <text x="256" y="250" font-family="'Inter', 'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3.5">
      ÜNİVERSİTESİ
    </text>
  </g>

  <!-- Lower Inner Shield Elements -->
  <!-- Inner Shield Boundary -->
  <path d="M 188 274 L 324 274 L 334 330 C 334 380 286 408 256 420 C 226 408 178 380 178 330 Z" 
        fill="#0a192f" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Knowledge Flame Torch in Inner Shield -->
  <g>
    <!-- Central Torch Flame -->
    <path d="M 256 270 C 248 284 242 294 246 304 C 250 312 262 312 266 304 C 270 292 264 280 256 270 Z" fill="url(#flameGrad)"/>
    
    <!-- Torch Handle / Holder -->
    <polygon points="249,306 263,306 258,358 254,358" fill="url(#goldGrad)"/>
    <rect x="247" y="303" width="18" height="5" rx="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Open Book of Knowledge -->
  <g>
    <!-- Left Page (Silver/White) -->
    <path d="M 254 340 C 238 335 220 334 202 338 L 202 376 C 220 372 238 373 254 378 Z" 
          fill="#f8fafc" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Left Page Inner Lines -->
    <line x1="212" y1="348" x2="244" y2="346" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="212" y1="356" x2="244" y2="354" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="212" y1="364" x2="238" y2="362" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Right Page (Golden/White) -->
    <path d="M 258 340 C 274 335 292 334 310 338 L 310 376 C 292 372 274 373 258 378 Z" 
          fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Right Page Inner Lines -->
    <line x1="268" y1="346" x2="300" y2="348" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="268" y1="354" x2="300" y2="356" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="268" y1="362" x2="294" y2="364" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Book Spine Center -->
    <path d="M 254 378 L 256 384 L 258 378 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden Olive Leaf Wreath Branches (Left & Right) -->
  <!-- Left Laurel Wreath -->
  <g fill="url(#goldGrad)">
    <path d="M 186 382 C 178 370 176 354 180 340 C 184 350 188 362 186 382 Z"/>
    <path d="M 174 366 C 164 354 164 340 170 328 C 174 338 176 350 174 366 Z"/>
    <path d="M 166 344 C 156 332 156 318 162 306 C 166 316 168 328 166 344 Z"/>
    <path d="M 162 320 C 152 308 152 294 158 282 C 162 292 164 304 162 320 Z"/>
    <path d="M 164 294 C 158 284 158 272 164 262 C 168 270 168 282 164 294 Z"/>
    <!-- Bottom Laurel Stem Connection -->
    <path d="M 200 410 C 220 422 240 428 256 430 C 242 426 226 418 208 406 Z"/>
  </g>

  <!-- Right Laurel Wreath -->
  <g fill="url(#goldGrad)">
    <path d="M 326 382 C 334 370 336 354 332 340 C 328 350 324 362 326 382 Z"/>
    <path d="M 338 366 C 348 354 348 340 342 328 C 338 338 336 350 338 366 Z"/>
    <path d="M 346 344 C 356 332 356 318 350 306 C 346 316 344 328 346 344 Z"/>
    <path d="M 350 320 C 360 308 360 294 354 282 C 350 292 348 304 350 320 Z"/>
    <path d="M 348 294 C 354 284 354 272 348 262 C 344 270 344 282 348 294 Z"/>
    <!-- Bottom Laurel Stem Connection -->
    <path d="M 312 410 C 292 422 272 428 256 430 C 270 426 286 418 304 406 Z"/>
  </g>

  <!-- Five-pointed Golden Star in upper-right inner shield -->
  <polygon points="314,286 318,296 328,296 320,302 323,312 314,306 305,312 308,302 300,296 310,296" 
           fill="url(#goldGrad)"/>

  <!-- Sparkle & Sheen Light Accents -->
  <ellipse cx="140" cy="120" rx="60" ry="20" transform="rotate(-30 140 120)" fill="#ffffff" fill-opacity="0.1" filter="blur(8px)"/>
  <circle cx="390" cy="200" r="3" fill="#ffffff" filter="url(#glow)"/>
</svg>
